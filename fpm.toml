name = "fscikit-learn"
version = "0.1.0"
license = "MIT"
description = "Dense machine learning in modern Fortran, inspired by scikit-learn"
author = "fscikit-learn contributors"

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[install]
library = true

[dependencies]
lbfgsb = { path = "vendor/lbfgsb" }
